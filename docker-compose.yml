services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smshop}
      POSTGRES_DB: ${POSTGRES_DB:-smshop}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-smshop} -d ${POSTGRES_DB:-smshop}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
