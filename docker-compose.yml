services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smshop}
      POSTGRES_DB: ${POSTGRES_DB:-smshop}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-smshop} -d ${POSTGRES_DB:-smshop}']
      interval: 5s
      timeout: 3s
      retries: 10

  # Isolated database for database-backed tests. Not started by `db:up`
  # (profile `test`); started explicitly by `db:test:up`. Uses its own port and
  # volume so it can never touch development data.
  db-test:
    profiles: ['test']
    image: postgres:18
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:-smshop_test}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-smshop_test}
      POSTGRES_DB: ${TEST_POSTGRES_DB:-smshop_test}
    ports:
      - '${TEST_POSTGRES_PORT:-5433}:5432'
    volumes:
      - pgtestdata:/var/lib/postgresql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${TEST_POSTGRES_USER:-smshop_test} -d ${TEST_POSTGRES_DB:-smshop_test}',
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  pgtestdata:
