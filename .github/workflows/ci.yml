name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://smshop_test:smshop_test@localhost:5432/smshop_test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: smshop_test
          POSTGRES_PASSWORD: smshop_test
          POSTGRES_DB: smshop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smshop_test -d smshop_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify:ci
