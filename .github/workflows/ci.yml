name: CI

# Single application workflow. Verification jobs run first; the image jobs are
# connected to them with `needs`, so images are published to GHCR only after
# every required check has passed for the exact checked source commit.
#
# Publication happens only on trusted events (push to main, a v* tag, or an
# explicitly authorized manual dispatch). Pull requests never publish and never
# receive the packages:write credential.
#
# The build/push steps are preserved verbatim from the former images.yml:
# repositories, SHA tags, revision labels, immutable digests, linux/arm64 and the
# Turnstile build argument.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege at the workflow level; only the publication job is granted
# packages:write.
permissions:
  contents: read

jobs:
  changes:
    name: Detect runtime changes
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.detect.outputs.runtime }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify the change (runtime vs documentation-only)
        id: detect
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          # No usable baseline (new branch / first push / manual dispatch):
          # be conservative and treat the change as runtime-affecting.
          if [ -z "${BASE:-}" ] || printf '%s' "$BASE" | grep -qE '^0+$' || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "runtime=true" >> "$GITHUB_OUTPUT"
            echo "No usable baseline; treating as a runtime change."
            exit 0
          fi
          runtime=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              *.md | docs/*) ;; # documentation only
              *)
                runtime=true
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE" "$HEAD")
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          echo "runtime=$runtime"

  workflow:
    name: Workflow checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Commit messages, task records and local links
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node scripts/ci/check-workflow.mjs all --base "$BASE" --head "${{ github.sha }}"
      - name: Workflow checker fixture tests
        run: node --test scripts/ci/check-workflow.test.mjs

  verify:
    name: Verify
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://smshop_test:smshop_test@localhost:5432/smshop_test
      WEB_ORIGIN: http://localhost:3101
      JWT_ACCESS_SECRET: ci-only-jwt-access-secret-value-32-characters
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: smshop_test
          POSTGRES_PASSWORD: smshop_test
          POSTGRES_DB: smshop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smshop_test -d smshop_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify:ci

  # Publication gate: runs only when `workflow` and `verify` both succeeded for
  # this checkout (a failed, cancelled or skipped required job skips this job),
  # and only on a trusted event. `github.sha` is the exact commit that was checked.
  build:
    name: Build ${{ matrix.name }}
    needs: [workflow, verify]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            dockerfile: docker/web.Dockerfile
            suffix: web
          - name: api
            dockerfile: docker/api.Dockerfile
            suffix: api
    steps:
      - name: Checkout the checked commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.suffix }}
          tags: |
            type=sha,format=long
            type=ref,event=tag

      - name: Require public Turnstile site key (web)
        if: matrix.name == 'web'
        env:
          TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        run: |
          if [ -z "$TURNSTILE_SITE_KEY" ]; then
            echo "::error::Repository variable NEXT_PUBLIC_TURNSTILE_SITE_KEY is unset. Refusing to publish a web image with Turnstile disabled."
            exit 1
          fi

      - name: Build and push ${{ matrix.name }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Public site key for the web image only (inlined by Next.js). The API
          # image is unaffected. Sourced from a repository variable, never a secret.
          build-args: |
            ${{ matrix.name == 'web' && format('NEXT_PUBLIC_TURNSTILE_SITE_KEY={0}', vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deterministic per-image manifest part, built from the real pushed digest.
      - name: Write image manifest part
        env:
          SUFFIX: ${{ matrix.suffix }}
          IMAGE_REF: ghcr.io/${{ github.repository }}-${{ matrix.suffix }}@${{ steps.build.outputs.digest }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          mkdir -p .manifest
          node <<'NODE'
          const fs = require('node:fs');
          const part = {
            ref: process.env.IMAGE_REF,
            platform: 'linux/arm64',
            tag: process.env.IMAGE_TAG,
          };
          fs.writeFileSync(
            `.manifest/${process.env.SUFFIX}.json`,
            JSON.stringify(part, null, 2) + '\n',
          );
          NODE

      - name: Record immutable digest
        run: |
          echo "### ${{ matrix.name }} image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ github.repository }}-${{ matrix.suffix }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload image manifest part
        uses: actions/upload-artifact@v4
        with:
          name: release-part-${{ matrix.suffix }}
          path: .manifest/${{ matrix.suffix }}.json
          if-no-files-found: error
          retention-days: 90

  release:
    name: Release manifest
    needs: [build]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download image manifest parts
        uses: actions/download-artifact@v4
        with:
          pattern: release-part-*
          merge-multiple: true
          path: parts

      # Assemble one build manifest from the two real per-image digests.
      - name: Assemble release manifest
        env:
          SOURCE_REPOSITORY: github.com/${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref_name }}
          IMAGES_RUN_ID: ${{ github.run_id }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const read = (name) => JSON.parse(fs.readFileSync(`parts/${name}.json`, 'utf8'));
          const manifest = {
            schemaVersion: 1,
            createdAt: new Date().toISOString(),
            source: {
              repository: process.env.SOURCE_REPOSITORY,
              commit: process.env.SOURCE_COMMIT,
              ref: process.env.SOURCE_REF,
            },
            ci: { imagesRunId: process.env.IMAGES_RUN_ID },
            images: { web: read('web'), api: read('api') },
          };
          fs.writeFileSync('release-manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          NODE

      - name: Publish release manifest summary
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const m = JSON.parse(fs.readFileSync('release-manifest.json', 'utf8'));
          const lines = [
            '### Release manifest (build artifact, not a deployment)',
            '',
            `- source: \`${m.source.repository}@${m.source.commit}\` (${m.source.ref})`,
            `- images run: \`${m.ci.imagesRunId}\``,
            `- web: \`${m.images.web.ref}\``,
            `- api: \`${m.images.api.ref}\``,
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          NODE

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 90

  # Automatic staging deployment. Runs only when every required verification,
  # image-publish and release-manifest job succeeded for this exact commit, on
  # trusted events only, and only for a runtime-affecting change. It stages the
  # manifest produced by *this* run (stdin) and releases/statuses it through the
  # restricted `deploy` entry point — never resolving "latest", never rebuilding.
  deploy:
    name: Deploy staging
    needs: [changes, workflow, verify, build, release]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://sokoladas.eu
    concurrency:
      group: sokoladas-staging-deploy
      cancel-in-progress: false
    steps:
      - name: Documentation-only change — automatic deployment skipped
        if: needs.changes.outputs.runtime != 'true'
        run: |
          echo "No runtime/build-input change; automatic staging deployment is skipped."
          {
            echo "### Staging deployment skipped"
            echo "Documentation-only change (no runtime or build inputs)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download the release manifest from this run
        if: needs.changes.outputs.runtime == 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: deploy

      - name: Reject stale runs (older than the current main tip)
        id: stale
        if: needs.changes.outputs.runtime == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: stale-run check not applied."
            exit 0
          fi
          tip="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).sha))')"
          if [ "$tip" != "$SHA" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Staging deployment skipped (stale run)"
              echo "This run builds \`$SHA\`; main is now \`$tip\`, so the newer run supersedes it."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "stale=true"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "stale=false"
          fi

      - name: Install the deploy SSH key and pinned host key
        id: ssh
        if: needs.changes.outputs.runtime == 'true' && steps.stale.outputs.stale != 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_SSH_KEY:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "DEPLOY_SSH_KEY is not configured for the staging environment; skipping deployment."
            {
              echo "### Staging deployment not configured"
              echo "READY_FOR_DEPLOYMENT_CONFIGURATION: add the secret \`DEPLOY_SSH_KEY\` to the GitHub \`staging\` environment."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          cat > "$HOME/.ssh/known_hosts" <<'KNOWN'
          sokoladas.eu ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJXXqORBvzdLxWzEEFt+l6ei+it8soHtH8SAJ6f69m74
          KNOWN
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Prepare the approved release manifest
        id: manifest
        if: needs.changes.outputs.runtime == 'true' && steps.stale.outputs.stale != 'true' && steps.ssh.outputs.configured == 'true'
        env:
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const build = JSON.parse(fs.readFileSync('deploy/release-manifest.json', 'utf8'));
          const sha = process.env.SHA;
          const release = {
            ...build,
            releaseId: `ci-${sha.slice(0, 12)}`,
            notes: `Automatic staging deployment from CI run ${process.env.RUN_ID} for commit ${sha}.`,
          };
          fs.writeFileSync('deploy/manifest.json', JSON.stringify(release, null, 2) + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `release_id=${release.releaseId}\n`);
          NODE

      - name: Stage, release and status through the restricted entry point
        if: needs.changes.outputs.runtime == 'true' && steps.stale.outputs.stale != 'true' && steps.ssh.outputs.configured == 'true'
        env:
          RELEASE_ID: ${{ steps.manifest.outputs.release_id }}
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts deploy@sokoladas.eu"
          echo "::group::stage $RELEASE_ID"
          $SSH "sudo -n /usr/local/sbin/sokoladas-deploy stage $RELEASE_ID" < deploy/manifest.json | tee deploy/stage.log
          echo "::endgroup::"
          echo "::group::release $RELEASE_ID"
          $SSH "sudo -n /usr/local/sbin/sokoladas-deploy release $RELEASE_ID" | tee deploy/release.log
          echo "::endgroup::"
          echo "::group::status"
          $SSH "sudo -n /usr/local/sbin/sokoladas-deploy status" | tee deploy/status.log
          echo "::endgroup::"

      - name: Verify live health
        if: needs.changes.outputs.runtime == 'true' && steps.stale.outputs.stale != 'true' && steps.ssh.outputs.configured == 'true'
        run: |
          set -euo pipefail
          for path in /health/ready / /tortai; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://sokoladas.eu$path")"
            echo "$code https://sokoladas.eu$path"
            if [ "$code" != "200" ]; then
              echo "::error::health check failed for $path (HTTP $code)"
              exit 1
            fi
          done

      - name: Publish deployment summary
        if: always() && needs.changes.outputs.runtime == 'true' && steps.stale.outputs.stale != 'true'
        run: |
          {
            echo "### Staging deployment"
            echo "- source SHA: \`${{ github.sha }}\`"
            echo "- release id: \`${{ steps.manifest.outputs.release_id }}\`"
            echo "- run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f deploy/release.log ]; then
            grep -E '^(sokoladas-deploy|deploy):' deploy/release.log >> "$GITHUB_STEP_SUMMARY" || true
          fi
